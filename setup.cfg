[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    dggrid,
    build,
    dist
extend-ignore =
    E501,
    E266,
    W503,
    W504,
    F403,
    F405
per-file-ignores =
    vgrid.py: F403,F405
    latlon2dggs.py: F403,F405
    dggsclient.py: F403,F405
    dggsjson2geojson.py: F403,F405
    expressions.py: F403,F405
    dggsgrid/*: F403,F405
    processing_provider/conversion/*: F403,F405
    processing_provider/resampling/*: F403,F405
    processing_provider/generator/dggalgen.py: F403,F405
    utils/conversion/*: F403,F405
    utils/resampling/dggsgrid.py: F403,F405
